name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run check
      - name: Run tests
        run: npm test
        env:
          # Keep CI hermetic: no real upstream keys, no `pass` lookups.
          MINIMAX_API_KEY: ""
          CHUTES_API_TOKEN: ""
          OPENROUTER_API_KEY: ""