name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install deps
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Merge gate
        run: |
          # fixture gate: verify at least one *.test.ts exists
          count=$(find . -path './node_modules' -prune -o -path './.git' -prune -o -name '*.test.ts' -print | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no *.test.ts files found"
            exit 1
          fi
          echo "OK: found $count test file(s)"