<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=375, initial-scale=1, viewport-fit=cover" />
<title>arc-webui · HITL</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232730;
    --border: #2c313c;
    --fg: #e6e8eb;
    --fg-dim: #98a0ad;
    --accent: #6aa8ff;
    --accent-2: #4d8bff;
    --danger: #ff6a6a;
    --ok: #57c98c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .status { font-size: 12px; color: var(--fg-dim); }
  header .status.ok { color: var(--ok); }
  header .status.err { color: var(--danger); }

  .list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-dim); }
  .card .type-badge {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px;
    background: var(--accent-2); color: white;
  }
  .card .type-badge.hitl { background: var(--ok); }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; word-break: break-word; }
  .card .body {
    background: var(--panel-2); border-radius: 8px; padding: 10px;
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
    max-height: 30vh; overflow-y: auto;
  }
  .card .empty-body { color: var(--fg-dim); font-style: italic; }
  .card .draft {
    background: var(--panel-2); border-radius: 8px; padding: 10px;
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
  }
  .card .draft-label { font-size: 11px; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .card .draft.empty { color: var(--fg-dim); font-style: italic; }
  .card .alts ul {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 4px;
  }
  .card .alt {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font-size: 12px;
    color: var(--fg);
  }
  .card .thread-id { font-size: 10px; color: var(--fg-dim); font-family: monospace; }
  .card .state-badge {
    display: inline-block; font-size: 10px; padding: 2px 6px;
    border-radius: 4px; background: var(--panel-2);
  }
  .card .state-badge.claimed { border-left: 3px solid var(--accent); }
  .card .state-badge.wip { border-left: 3px solid var(--accent-2); }
  .card .state-badge.blocked { border-left: 3px solid var(--danger); }
  .card .actions {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .card .actions button {
    padding: 6px 12px; border-radius: 6px; border: 0;
    font-size: 12px; cursor: pointer; font: inherit;
  }
  .card .actions .btn-primary {
    background: var(--accent-2); color: white; font-weight: 600;
  }
  .card .actions .btn-secondary {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--border);
  }
  .empty {
    padding: 32px 16px; text-align: center; color: var(--fg-dim);
  }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--ok); color: var(--ok); }
  .toast.err { border-color: var(--danger); color: var(--danger); }

  /* Modal overlay for HITL-type rows */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; justify-content: center; align-items: center;
    z-index: 30; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; width: 100%; max-width: 400px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .modal h3 { margin: 0; font-size: 16px; }
  .modal .close-btn {
    align-self: flex-end; background: none; border: none;
    color: var(--fg-dim); cursor: pointer; font-size: 20px;
  }
</style>
</head>
<body>
<header>
  <h1>HITL · panel</h1>
  <span class="status" id="status">connecting…</span>
</header>
<main>
  <div id="list" class="list"></div>
</main>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="close-btn" id="modal-close">×</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="actions">
      <button class="btn-primary" id="modal-confirm">approve</button>
      <button class="btn-secondary" id="modal-reject">reject</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const list = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const toast = document.getElementById("toast");
  const modal = document.getElementById("modal-overlay");
  const modalTitle = document.getElementById("modal-title");
  const modalBody = document.getElementById("modal-body");
  const modalClose = document.getElementById("modal-close");
  const modalConfirm = document.getElementById("modal-confirm");
  const modalReject = document.getElementById("modal-reject");

  let hitlRows = [];

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status " + (cls || "");
  }
  function showToast(text, cls) {
    toast.textContent = text;
    toast.className = "toast show " + (cls || "");
    setTimeout(() => { toast.className = "toast " + (cls || ""); }, 2200);
  }

  function openModal(row) {
    modalTitle.textContent = row.title || "(untitled)";
    modalBody.innerHTML = "";
    if (row.body_md) {
      const div = document.createElement("div");
      div.className = "body";
      div.textContent = row.body_md;
      modalBody.appendChild(div);
    }
    if (row.draft_md) {
      const div = document.createElement("div");
      div.className = "draft";
      const lbl = document.createElement("div");
      lbl.className = "draft-label";
      lbl.textContent = "draft";
      div.appendChild(lbl);
      const txt = document.createElement("span");
      txt.textContent = row.draft_md;
      div.appendChild(txt);
      modalBody.appendChild(div);
    }
    modal.classList.add("open");
  }

  function closeModal() { modal.classList.remove("open"); }

  function render(rows) {
    hitlRows = rows;
    list.innerHTML = "";
    if (rows.length === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "no HITL rows. inbox is quiet.";
      list.appendChild(e);
      return;
    }
    for (const row of rows) {
      const card = document.createElement("div");
      card.className = "card";

      const meta = document.createElement("div");
      meta.className = "meta";

      const badge = document.createElement("span");
      badge.className = "type-badge hitl";
      badge.textContent = row.type === "HITL" ? "HITL" : "flagged";
      meta.appendChild(badge);

      const stateBadge = document.createElement("span");
      stateBadge.className = "state-badge " + (row.state || "");
      stateBadge.textContent = row.state || "";
      meta.appendChild(stateBadge);

      if (row.thread_id) {
        const ti = document.createElement("span");
        ti.className = "thread-id";
        ti.textContent = row.thread_id;
        meta.appendChild(ti);
      }
      card.appendChild(meta);

      const h2 = document.createElement("h2");
      h2.textContent = row.title || "(untitled)";
      card.appendChild(h2);

      if (row.body_md) {
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = row.body_md;
        card.appendChild(body);
      } else {
        const body = document.createElement("div");
        body.className = "body empty-body";
        body.textContent = "(no body)";
        card.appendChild(body);
      }

      if (row.draft_md) {
        const draft = document.createElement("div");
        draft.className = "draft";
        const lbl = document.createElement("div");
        lbl.className = "draft-label";
        lbl.textContent = "draft";
        draft.appendChild(lbl);
        const txt = document.createElement("span");
        txt.textContent = row.draft_md;
        draft.appendChild(txt);
        card.appendChild(draft);
      }

      // Actions: open in modal for any HITL-type row
      const actions = document.createElement("div");
      actions.className = "actions";
      const detailBtn = document.createElement("button");
      detailBtn.className = "btn-secondary";
      detailBtn.textContent = "view / act";
      detailBtn.addEventListener("click", () => openModal(row));
      actions.appendChild(detailBtn);
      card.appendChild(actions);

      list.appendChild(card);
    }
  }

  // Modals
  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  modalConfirm.addEventListener("click", () => {
    showToast("approved — ledger update pending arc-webui HITL answer endpoint", "ok");
    closeModal();
  });
  modalReject.addEventListener("click", () => {
    showToast("rejected — ledger update pending arc-webui HITL answer endpoint", "err");
    closeModal();
  });

  async function refreshHitl() {
    try {
      const r = await fetch("/api/hitl");
      if (!r.ok) return;
      const data = await r.json();
      render(data.rows || []);
    } catch {}
  }

  function startSse() {
    const es = new EventSource("/sse/hitl");
    es.addEventListener("snapshot", (e) => {
      const data = JSON.parse(e.data);
      render(data.rows || []);
    });
    es.addEventListener("heartbeat", () => setStatus("live", "ok"));
    es.addEventListener("error", () => setStatus("reconnecting…", "err"));
    es.addEventListener("open", () => setStatus("live", "ok"));
  }

  refreshHitl();
  startSse();
})();
</script>
</body>
</html>
