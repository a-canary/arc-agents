    mission_oneliner: (variable)  # has MISSION.md — resolve from it, not invented
    notes: only repo with a pre-existing MISSION.md

  - name: bug-bounty-agent
    path: ~/repos/bug-bounty-agent
    tier: directed-external
    driver: external
    mission_oneliner: (variable)
    notes: already self-drives via its own heartbeat/budget-gated relaunch loop; converting to /director is a separate mission (see assumptions.md)

