# Fleet registry — canonical source of truth for which repos run a /director,
# their rollout order, and how each is driven.
#
# Populated by .wargame/wargames/director-census.md Move 2 (2026-07-06).
# Canonical here; consuming location is a symlink (~/.config/arc/fleet.yaml)
# per the symlink doctrine — never hand-maintain a divergent copy.
#
# tier:
#   directed          — gets a /director, in the active rollout
#   directed-external — already self-drives via its own loop; not converted
#   scaffold-later     — has docs/mission but not yet in the rollout
#   duplicate          — flag only, no destructive action (see ledger.md)
#   skip               — no remote / dormant / orphan checkout / home repo
#
# driver: self | external | none
#
# rollout_order is only meaningful for tier=directed rows (operator-confirmed
# 2026-07-06, overriding the runbook's "trading last" default — see ledger.md).

repos:
  - name: trading
    path: ~/repos/trading
    tier: directed
    rollout_order: 1
    driver: self
    mission_oneliner: (variable)  # resolve from repo's own docs/memory at census Move 3 — do not invent
    notes: draft-PR-only cap stays regardless of rollout position (CI billing-red / PAT-403 known condition)

  - name: OneNation
    path: ~/projects/OneNation
    tier: directed
    rollout_order: 2
    driver: self
    mission_oneliner: (variable)
    notes: pilot repo for attended onboarding (drivers Move 2)

  - name: arc-factory
    path: ~/repos/arc-factory
    tier: directed
    rollout_order: 3
    driver: self
    mission_oneliner: (variable)

  - name: arc-agents
    path: ~/repos/arc-agents
    tier: directed
    rollout_order: 3
    driver: self
    mission_oneliner: (variable)
